[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meddeid-core"
version = "0.2.1"
description = "Language-neutral schema, taxonomy, and span contracts for MedDeID"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{name = "Stig Hellemans"}]
keywords = ["de-identification", "clinical-nlp", "privacy", "schema"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.urls]
Homepage = "https://stighellemans.github.io/meddeid/"
Documentation = "https://stighellemans.github.io/meddeid/concepts/data-contract/"
Source = "https://github.com/stighellemans/meddeid-core"
Issues = "https://github.com/stighellemans/meddeid-core/issues"
"MedDeID on Hugging Face" = "https://huggingface.co/collections/stighellemans/meddeid"

[project.optional-dependencies]
models = ["pydantic>=2"]
dev = ["pydantic>=2", "pytest>=8"]

[project.scripts]
meddeid-export-contracts = "meddeid_core.export_contracts:main"
meddeid-normalize-jsonl = "meddeid_core.normalize_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meddeid_core = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
